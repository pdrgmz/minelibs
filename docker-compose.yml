services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Puerto interno fijo: nginx proxya a app:3000. `PORT` sólo publica el frontend.
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DATABASE_URL: ${DATABASE_URL:-file:/data/db/minelibs.db}
      STORAGE_DIR: ${STORAGE_DIR:-/data/schematics}
      ASSETS_DIR: ${ASSETS_DIR:-/data/assets}
      THUMBNAILS_DIR: ${THUMBNAILS_DIR:-/data/thumbnails}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      MAX_DECOMPRESSED_MB: ${MAX_DECOMPRESSED_MB:-256}
      MAX_DIMENSION: ${MAX_DIMENSION:-4096}
      MAX_BLOCKS: ${MAX_BLOCKS:-10000000}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-antes-de-exponer-la-app}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiar-esta-contrasena}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      MAX_SCHEMATICS_PER_USER: ${MAX_SCHEMATICS_PER_USER:-200}
      MAX_STORAGE_MB_PER_USER: ${MAX_STORAGE_MB_PER_USER:-1024}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-5}
      RATE_LIMIT_AUTH_WINDOW_MINUTES: ${RATE_LIMIT_AUTH_WINDOW_MINUTES:-1}
      DEFAULT_MC_VERSION: ${DEFAULT_MC_VERSION:-1.21.4}
      ASSETS_UPSTREAM_URL: ${ASSETS_UPSTREAM_URL:-https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets}
      ASSETS_CACHE_TTL_SECONDS: ${ASSETS_CACHE_TTL_SECONDS:-86400}
      ASSETS_FETCH_TIMEOUT_MS: ${ASSETS_FETCH_TIMEOUT_MS:-10000}
      ASSETS_MAX_FILE_MB: ${ASSETS_MAX_FILE_MB:-16}
      MAX_IMPORT_ZIP_MB: ${MAX_IMPORT_ZIP_MB:-512}
      MAX_IMPORT_ENTRIES: ${MAX_IMPORT_ENTRIES:-2000}
      MAX_MANIFEST_KB: ${MAX_MANIFEST_KB:-2048}
    volumes:
      - ./data/schematics:/data/schematics
      - ./data/assets:/data/assets
      - ./data/thumbnails:/data/thumbnails
      - ./data/db:/data/db
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
