services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data/schematics:/data/schematics
      - ./data/assets:/data/assets
      - ./data/thumbnails:/data/thumbnails
      - ./data/db:/data/db
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
