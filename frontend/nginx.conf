server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ZIP de backup (MAX_IMPORT_ZIP_MB + margen).
    client_max_body_size 550m;

    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store" always;
    }

    location /health {
        proxy_pass http://app:3000;
        access_log off;
    }

    # Solo los assets de Minecraft van al backend; los bundles hashed de Vite son estáticos.
    location /assets/mc/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # JS/CSS/worker del build: servidos por nginx con caché inmutable (el nombre incluye hash).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El service worker nunca debe quedarse cacheado en el proxy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
